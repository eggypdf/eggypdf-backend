name: Package EggyPDF Homepage V2

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout V2 branch
        uses: actions/checkout@v4

      - name: Build isolated Cloudflare package
        shell: bash
        run: |
          set -euo pipefail
          OUT="EggyPDF-Homepage-V2-Cloudflare"
          rm -rf "$OUT" EggyPDF-Homepage-V2-Cloudflare.zip
          mkdir -p "$OUT/tools"
          cp index.html "$OUT/index.html"
          for f in ats-checker.html career-pro.html resume-builder.html about-us.html contact.html privacy-policy.html terms.html cookie-policy.html robots.txt sitemap.xml favicon.svg; do
            test -f "$f" || { echo "Missing required source: $f"; exit 1; }
            cp "$f" "$OUT/$f"
          done
          test -f egg.png && cp egg.png "$OUT/egg.png" || true
          if [ -f blog.html ]; then cp blog.html "$OUT/blog.html"; elif [ -f site_editor-1/blog.html ]; then cp site_editor-1/blog.html "$OUT/blog.html"; fi
          if [ -d site_editor-1/blog ]; then cp -R site_editor-1/blog "$OUT/blog"; fi
          TOOLS=(merge compress split pdf-to-word word-to-pdf ppt-to-pdf excel-to-pdf jpg-to-pdf pdf-to-jpg png-to-pdf pdf-to-png protect unlock watermark rotate delete-pages page-numbers crop pdf-to-excel pdf-to-ppt pdf-to-text)
          for tool in "${TOOLS[@]}"; do
            test -f "${tool}.html" || { echo "Missing tool source: ${tool}.html"; exit 1; }
            cp "${tool}.html" "$OUT/tools/${tool}.html"
          done
          if [ -f site_editor-1/tools/qr-code.html ]; then cp site_editor-1/tools/qr-code.html "$OUT/tools/qr-code.html"; fi
          cat > "$OUT/V2-PACKAGE.txt" <<'EOF'
          EggyPDF Homepage V2 Cloudflare Package
          ======================================
          Isolated dark/lime Homepage V2 package.
          Existing rollback/older deployment packages are not modified by this workflow.
          EOF

      - name: Validate V2 package
        shell: bash
        run: |
          set -euo pipefail
          OUT="EggyPDF-Homepage-V2-Cloudflare"
          check(){ grep -Fq "$1" "$2" || { echo "VALIDATION FAILED: '$1' missing from $2"; exit 1; }; }
          check 'Everything you need' "$OUT/index.html"
          check '100% Free PDF Tools' "$OUT/index.html"
          check 'View All Tools' "$OUT/index.html"
          check 'id="drawer"' "$OUT/index.html"
          check 'id="search"' "$OUT/index.html"
          check 'resume-builder.html' "$OUT/index.html"
          check 'career-pro.html' "$OUT/index.html"
          check 'Sign In' "$OUT/index.html"
          check 'Sign Up' "$OUT/index.html"
          TITLE_COUNT=$(grep -Fo '<title>' "$OUT/index.html" | wc -l)
          [ "$TITLE_COUNT" -eq 1 ] || { echo "VALIDATION FAILED: expected 1 title, found $TITLE_COUNT"; exit 1; }
          if grep -Fq 'content=<meta' "$OUT/index.html"; then echo 'VALIDATION FAILED: malformed meta tag detected'; exit 1; fi
          TOOLS=(merge compress split pdf-to-word word-to-pdf ppt-to-pdf excel-to-pdf jpg-to-pdf pdf-to-jpg png-to-pdf pdf-to-png protect unlock watermark rotate delete-pages page-numbers crop pdf-to-excel pdf-to-ppt pdf-to-text)
          for tool in "${TOOLS[@]}"; do
            test -f "$OUT/tools/${tool}.html" || { echo "VALIDATION FAILED: missing packaged tool ${tool}.html"; exit 1; }
          done
          check '/api/career/pro/extract-resume' "$OUT/career-pro.html"
          check '/api/career/pro/optimize' "$OUT/career-pro.html"
          check '/api/career/pro/cover-letter' "$OUT/career-pro.html"
          check 'eggypdf_career_pro_checkout' "$OUT/career-pro.html"
          ! test -f "$OUT/tools/edit-pdf.html" || { echo 'VALIDATION FAILED: edit-pdf must not ship'; exit 1; }
          test -f "$OUT/V2-PACKAGE.txt" || { echo 'VALIDATION FAILED: V2 manifest missing'; exit 1; }
          echo 'Homepage V2 package validation passed.'

      - name: Create deployment ZIP
        shell: bash
        run: |
          set -euo pipefail
          cd EggyPDF-Homepage-V2-Cloudflare
          zip -qr ../EggyPDF-Homepage-V2-Cloudflare.zip .
          cd ..
          unzip -l EggyPDF-Homepage-V2-Cloudflare.zip | head -40
          ls -lh EggyPDF-Homepage-V2-Cloudflare.zip

      - name: Upload Homepage V2 artifact
        uses: actions/upload-artifact@v4
        with:
          name: EggyPDF-Homepage-V2-Cloudflare
          path: EggyPDF-Homepage-V2-Cloudflare.zip
          retention-days: 7
