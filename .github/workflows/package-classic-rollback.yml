name: Package EggyPDF Classic Rollback

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout last known-good classic frontend
        uses: actions/checkout@v4
        with:
          ref: 00a6c26029150684d6c61dbd106b8295b40a3bcc

      - name: Fetch latest Career Pro frontend from main
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin main
          git show FETCH_HEAD:career-pro.html > /tmp/career-pro-current.html
          git show FETCH_HEAD:career-pdf-summarizer.html > /tmp/career-pdf-summarizer-current.html
          grep -q 'Current resume score' /tmp/career-pro-current.html
          grep -q 'Current keyword match' /tmp/career-pro-current.html
          grep -q 'AI PDF Summarizer' /tmp/career-pdf-summarizer-current.html
          grep -q '/api/career/pro/pdf-summary' /tmp/career-pdf-summarizer-current.html

      - name: Build rollback Cloudflare package
        shell: bash
        run: |
          set -euo pipefail
          rm -rf cloudflare-rollback EggyPDF-Classic-Rollback-Cloudflare.zip
          mkdir -p cloudflare-rollback/tools cloudflare-rollback/blog

          cp index.html cloudflare-rollback/index.html
          python - <<'PY'
          from pathlib import Path
          p=Path('cloudflare-rollback/index.html'); s=p.read_text()
          s=s.replace('<title>EggyPDF – Free Online PDF Tools | Merge, Compress, Convert PDF</title> <title>EggyPDF – Free PDF Tools & Resume Builder Online</title>','<title>EggyPDF – Free PDF Tools & Resume Builder Online</title>')
          s=s.replace('<meta name="description" content=<meta name="description" content="Free PDF tools and resume builder online. Merge, compress, convert PDFs and create a job-ready resume in minutes. No sign-up needed. Built for UAE & Gulf job seekers.">','<meta name="description" content="Free PDF tools and resume builder online. Merge, compress, convert PDFs and create a job-ready resume in minutes. No sign-up needed. Built for UAE & Gulf job seekers."/>')
          s=s.replace('</style> .seo-section {','.seo-section {').replace('</head>','</style>\n</head>',1)

          if 'ATS Resume Checker' not in s:
              end='    </a>\n\n    <!-- ② MOST USED DAILY — Merge, Compress, Split -->'
              card='''    </a>\n\n    <a href="ats-checker.html" class="tool-card" data-cat="ai" style="border-color:#f5a623;background:linear-gradient(135deg,#fff8ed,#fff)">\n      <div class="tool-icon" style="background:#fff3cd;font-size:1.5rem">🎯</div>\n      <h3 style="color:#d4881a">ATS Resume Checker <span style="font-size:10px;background:#f5a623;color:#fff;padding:2px 7px;border-radius:20px;font-weight:700;vertical-align:middle;margin-left:4px">NEW</span></h3>\n      <p>Check your resume against a job description and find missing keywords and improvements.</p>\n    </a>\n\n    <!-- ② MOST USED DAILY — Merge, Compress, Split -->'''
              if end in s: s=s.replace(end,card,1)

          if 'QR Code Generator' not in s:
              marker='    <!-- ② MOST USED DAILY — Merge, Compress, Split -->'
              qr='''    <a href="tools/qr-code.html" class="tool-card" data-cat="convert">\n      <div class="tool-icon" style="background:#eef2ff;font-size:1.5rem">▦</div>\n      <h3>QR Code Generator</h3>\n      <p>Create QR codes for website links, text, email and contact details.</p>\n    </a>\n\n'''
              if marker not in s: raise SystemExit('QR insertion marker not found')
              s=s.replace(marker,qr+marker,1)

          create_anchor='<a href="resume-builder.html" style="color:var(--brand-dark);font-weight:600">📋 Resume Builder</a>'
          if 'tools/qr-code.html">QR Code Generator' not in s:
              if create_anchor not in s: raise SystemExit('Create menu anchor not found')
              s=s.replace(create_anchor,create_anchor+'\n          <a href="tools/qr-code.html">QR Code Generator</a>',1)

          p.write_text(s)
          PY

          cp ats-checker.html resume-builder.html cloudflare-rollback/
          cp /tmp/career-pro-current.html cloudflare-rollback/career-pro.html
          cp /tmp/career-pdf-summarizer-current.html cloudflare-rollback/career-pdf-summarizer.html

          python - <<'PY'
          from pathlib import Path
          p=Path('cloudflare-rollback/career-pro.html')
          s=p.read_text()
          old='<div class="actions"><button class="btn secondary" id="copyResume">Copy Optimized Resume</button></div>'
          new='<div class="actions"><button class="btn secondary" id="copyResume">Copy Optimized Resume</button><button class="btn secondary" type="button" onclick="exportResume(\'docx\')">Download DOCX</button><button class="btn secondary" type="button" onclick="exportResume(\'pdf\')">Download PDF</button></div>'
          if old not in s:
              raise SystemExit('Career Pro resume actions marker not found')
          s=s.replace(old,new,1)
          helper="""async function exportResume(format){if(!lastResume){alert('Optimize your resume first.');return}try{let r=await fetch(API+'/api/career/pro/export-resume',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({session_id:session,resume_text:lastResume,format})});if(!r.ok){let d={};try{d=await r.json()}catch{}throw Error(d.error||'Resume export failed.')}let blob=await r.blob(),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=format==='docx'?'EggyPDF-Optimized-Resume.docx':'EggyPDF-Optimized-Resume.pdf';document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}catch(e){alert(e.message)}};"""
          if '</script>' not in s:
              raise SystemExit('Career Pro script closing tag not found')
          s=s.replace('</script>',helper+'</script>',1)
          p.write_text(s)
          PY

          python - <<'PY'
          from pathlib import Path
          p=Path('cloudflare-rollback/career-pro.html')
          s=p.read_text()
          css='''.compare-wrap{margin:18px 0}.compare-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:10px}.compare-head h3{margin:0;font-size:15px}.compare-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.compare-card{border:1px solid #e5e7eb;border-radius:10px;background:#fff;padding:13px}.compare-card.before{background:#fff7ed;border-color:#fed7aa}.compare-card.after{background:#ecfdf5;border-color:#bbf7d0}.compare-label{font-size:10px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:#6b7280;margin-bottom:7px}.compare-text{white-space:pre-wrap;font-size:12.5px;line-height:1.55}.compare-pair{margin:10px 0}.delta{font-size:11px;font-weight:800;color:#166534}.changes-list{margin:8px 0 0;padding-left:18px}.changes-list li{margin-bottom:6px}.compare-empty{color:#9ca3af;font-style:italic}@media(max-width:760px){.compare-grid{grid-template-columns:1fr}}'''
          if '</style>' not in s: raise SystemExit('Career Pro style tag missing')
          s=s.replace('</style>',css+'</style>',1)
          helper="""function comparisonHtml(o){let c=o.comparison;if(!c)return'';let summary='<div class="compare-wrap"><div class="compare-head"><h3>Before vs After</h3><span class="delta">'+(c.score?.delta>0?'+':'')+(c.score?.delta??0)+' resume-score points</span></div><div class="compare-grid"><div class="compare-card before"><div class="compare-label">Original summary</div><div class="compare-text">'+esc(c.summary?.before||'No clearly labeled summary detected.')+'</div></div><div class="compare-card after"><div class="compare-label">Optimized summary</div><div class="compare-text">'+esc(c.summary?.after||'No optimized summary returned.')+'</div></div></div>';let pairs=(c.bullets||[]).map((x,i)=>'<div class="compare-pair"><div class="compare-grid"><div class="compare-card before"><div class="compare-label">Original bullet '+(i+1)+'</div><div class="compare-text '+(!x.before?'compare-empty':'')+'">'+esc(x.before||'No matching original bullet detected.')+'</div></div><div class="compare-card after"><div class="compare-label">Rewritten bullet '+(i+1)+'</div><div class="compare-text">'+esc(x.after||'')+'</div></div></div></div>').join('');let changes=(c.changes||[]).length?'<div class="compare-card" style="margin-top:12px"><div class="compare-label">What changed</div><ul class="changes-list">'+c.changes.map(x=>'<li>'+esc(x)+'</li>').join('')+'</ul></div>':'';return summary+pairs+changes+'</div>'}"""
          if 'function comparisonHtml' not in s:
              s=s.replace('function chips(',helper+'function chips(',1)
          marker="'+sparse+'<div class=\"block\"><h3>Optimized professional summary</h3>"
          if marker not in s: raise SystemExit('Career Pro optimizer output marker not found')
          s=s.replace(marker,"'+sparse+comparisonHtml(o)+'<div class=\"block\"><h3>Optimized professional summary</h3>",1)
          p.write_text(s)
          PY

          python - <<'PY'
          from pathlib import Path
          p=Path('cloudflare-rollback/career-pro.html')
          s=p.read_text()
          if 'career-pdf-summarizer.html' not in s:
              marker='<div class="tabs">'
              if marker not in s: raise SystemExit('Career Pro tabs marker not found')
              card='''<div class="card" style="margin-top:16px;border-color:#f3d594;background:linear-gradient(135deg,#fff8ed,#fff)"><h2>AI PDF Summarizer</h2><p class="muted">Summarize long text-based PDFs into an overview, key points, important details and action items.</p><a class="btn" href="career-pdf-summarizer.html" style="display:inline-block;text-decoration:none">Open AI PDF Summarizer</a></div>'''
              s=s.replace(marker,card+marker,1)
          p.write_text(s)
          PY

          python - <<'PY'
          from pathlib import Path
          p=Path('cloudflare-rollback/resume-builder.html'); s=p.read_text()
          s=s.replace('<head> <title>Free Resume Builder – Download PDF Instantly | EggyPDF</title>\n<meta name="description" content="Build a professional resume online and download as PDF for free. No sign-up needed. Designed for job seekers in UAE, Gulf, and worldwide.">','<head>\n<meta name="description" content="Build a professional resume online and download as PDF for free. No sign-up needed. Designed for job seekers in UAE, Gulf, and worldwide.">')
          marker='<section class="seo-section">'; i=s.find(marker)
          if i!=-1 and i>s.find('</html>'):
              seo=s[i:]; s=s[:i].rstrip()
              if s.endswith('</html>'): s=s[:-7].rstrip()
              if s.endswith('</body>'): s=s[:-7].rstrip()
              s=s+'\n\n'+seo+'\n</body>\n</html>\n'
          if '.seo-section{' not in s:
              css="""\n.seo-section{max-width:780px;margin:48px auto;padding:0 20px 48px;color:var(--text);font-family:'Inter',sans-serif;line-height:1.7}\n.seo-section h2{font-size:1.3rem;line-height:1.3;margin:28px 0 10px;color:var(--text)}\n.seo-section h3{font-size:1rem;line-height:1.4;margin:18px 0 6px;color:var(--text)}\n.seo-section p{font-size:.97rem;line-height:1.7;margin:0 0 14px;color:var(--muted)}\n@media(max-width:640px){.seo-section{margin:28px auto;padding:0 18px 36px}.seo-section h2{font-size:1.15rem}.seo-section p{font-size:.92rem}}\n"""
              s=s.replace('</style>',css+'</style>',1)
          p.write_text(s)
          PY

          cp about-us.html contact.html cookie-policy.html privacy-policy.html terms.html robots.txt sitemap.xml favicon.svg cloudflare-rollback/
          [ -f egg.png ] && cp egg.png cloudflare-rollback/ || true
          cp site_editor-1/blog.html cloudflare-rollback/blog.html
          cp -R site_editor-1/blog/. cloudflare-rollback/blog/

          for f in compress crop delete-pages excel-to-pdf jpg-to-pdf merge page-numbers pdf-to-excel pdf-to-jpg pdf-to-png pdf-to-ppt pdf-to-text pdf-to-word png-to-pdf ppt-to-pdf protect rotate split unlock watermark word-to-pdf; do
            test -f "$f.html"
            cp "$f.html" "cloudflare-rollback/tools/$f.html"
          done

          python - <<'PY'
          from pathlib import Path
          import re
          for p in Path('cloudflare-rollback/tools').glob('*.html'):
              s=p.read_text()
              s=re.sub(r'<section\b[^>]*class=["\'][^"\']*\bseo-section\b[^"\']*["\'][^>]*>.*?</section>','',s,flags=re.I|re.S)
              s=re.sub(r'<p([^>]*)>\s*</p>','',s,flags=re.I|re.S)
              p.write_text(s)
          PY
          if [ -f site_editor-1/tools/qr-code.html ]; then cp site_editor-1/tools/qr-code.html cloudflare-rollback/tools/qr-code.html; fi

          cat > cloudflare-rollback/ROLLBACK-PACKAGE.txt <<'EOF'
          EggyPDF Classic Rollback Package
          Source classic frontend snapshot: 00a6c26029150684d6c61dbd106b8295b40a3bcc
          Restores the pre-dark-redesign EggyPDF frontend while leaving the Render backend untouched.
          QR Code Generator restored to homepage and Create navigation.
          Career Pro frontend is pulled from current main.
          Career Pro optimized resumes can be downloaded as DOCX or PDF.
          Career Pro shows a before-vs-after summary, bullet comparison, score delta, and change notes.
          Career Pro includes individual section regeneration controls.
          Career Pro includes a paid AI PDF Summarizer page and entry point.
          EOF

          python - <<'PY'
          from pathlib import Path
          home=Path('cloudflare-rollback/index.html').read_text()
          ats=Path('cloudflare-rollback/ats-checker.html').read_text()
          pro=Path('cloudflare-rollback/career-pro.html').read_text()
          summary=Path('cloudflare-rollback/career-pdf-summarizer.html').read_text()
          assert home.count('<title>')==1 and 'content=<meta' not in home
          assert '#f5a623' in home
          assert 'Everything you need' not in home
          assert 'ATS Resume Checker' in home
          assert 'QR Code Generator' in home
          assert 'href="tools/qr-code.html"' in home
          assert home.count('QR Code Generator') >= 2
          assert 'career-pro.html' in ats and 'eggypdf_career_pro_checkout' in ats
          assert '/api/career/pro/extract-resume' in pro
          assert '/api/career/pro/optimize' in pro
          assert '/api/career/pro/cover-letter' in pro
          assert '/api/career/pro/regenerate-section' in pro
          assert '/api/career/pro/export-resume' in pro
          assert 'Download DOCX' in pro and 'Download PDF' in pro
          assert 'Before vs After' in pro and 'comparisonHtml' in pro
          assert 'Original summary' in pro and 'Rewritten bullet' in pro
          assert 'eggypdf_career_pro_checkout' in pro
          assert 'Current resume score' in pro
          assert 'Optimized resume score' in pro
          assert 'Current keyword match' in pro
          assert '100% keyword match does not mean the resume scored 100/100' in pro
          assert 'career-pdf-summarizer.html' in pro
          assert 'Open AI PDF Summarizer' in pro
          assert 'AI PDF Summarizer' in summary
          assert '/api/career/pro/pdf-summary' in summary
          assert 'eggypdf_career_pro_checkout' in summary
          required=['merge','compress','split','pdf-to-word','word-to-pdf','ppt-to-pdf','excel-to-pdf','jpg-to-pdf','pdf-to-jpg','png-to-pdf','pdf-to-png','protect','unlock','watermark','rotate','delete-pages','page-numbers','crop','pdf-to-excel','pdf-to-ppt','pdf-to-text']
          assert all(Path(f'cloudflare-rollback/tools/{x}.html').exists() for x in required)
          assert Path('cloudflare-rollback/tools/qr-code.html').exists()
          print('ROLLBACK VALIDATION PASSED: QR + Career Pro scoring + exports + comparison + regeneration + AI PDF Summarizer')
          PY

          (cd cloudflare-rollback && zip -qr ../EggyPDF-Classic-Rollback-Cloudflare.zip .)

      - name: Upload rollback package
        uses: actions/upload-artifact@v4
        with:
          name: EggyPDF-Classic-Rollback-Cloudflare
          path: EggyPDF-Classic-Rollback-Cloudflare.zip
          if-no-files-found: error
          retention-days: 7
