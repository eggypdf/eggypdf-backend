name: Package EggyPDF Career Pro Release

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout current branch
        uses: actions/checkout@v4

      - name: Restore last validated classic package
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          rm -rf release /tmp/eggy-base
          mkdir -p release /tmp/eggy-base

          artifact_id="$(
            gh api "repos/${{ github.repository }}/actions/artifacts?per_page=100" \
              --jq '[.artifacts[] | select(.name=="EggyPDF-Classic-Rollback-Cloudflare" and .expired==false)] | sort_by(.created_at) | reverse | .[0].id // empty'
          )"
          if [ -z "$artifact_id" ]; then
            echo "No non-expired EggyPDF-Classic-Rollback-Cloudflare artifact exists."
            echo "Run the 'Package EggyPDF Classic Rollback' workflow first, then rerun this workflow."
            exit 1
          fi

          echo "Using classic rollback artifact ID: $artifact_id"
          gh api "repos/${{ github.repository }}/actions/artifacts/${artifact_id}/zip" > /tmp/eggy-base/artifact.zip
          unzip -q /tmp/eggy-base/artifact.zip -d /tmp/eggy-base/outer
          unzip -q /tmp/eggy-base/outer/EggyPDF-Classic-Rollback-Cloudflare.zip -d release
          test -f release/index.html
          test -f release/ats-checker.html
          test -f release/career-pro.html

      - name: Apply Career Pro continuity, UX and billing fixes
        shell: bash
        run: |
          set -euo pipefail
          cp career-pdf-summarizer.html release/career-pdf-summarizer.html
          python release_patch.py release/ats-checker.html release/career-pro.html

          python - <<'PY'
          from pathlib import Path
          p=Path('release/ats-checker.html')
          s=p.read_text()

          if 'id="careerProOverview"' not in s:
              overview='''<section class="card pro-card" id="careerProOverview" style="max-width:1120px;margin:22px auto 0"><div class="pro-grid"><div><div class="pro-badge">Career Pro</div><h2>Go from ATS check to a complete job application.</h2><p class="pro-copy">Upgrade once and keep working with the same resume in this browser session — no repetitive upload after the free ATS check.</p><div class="pro-list"><div><span>✓</span>AI resume optimizer</div><div><span>✓</span>Job-specific tailoring</div><div><span>✓</span>Regenerate individual sections</div><div><span>✓</span>AI cover letter</div><div><span>✓</span>DOCX & PDF resume export</div><div><span>✓</span>AI PDF Summarizer</div></div></div><div class="pro-action"><div class="pro-price">Career Pro<small>Secure checkout · Dodo Payments</small></div><button class="pro-btn" id="unlockProTop" type="button">Unlock Career Pro</button><div class="pro-note">Your free ATS resume and job description are carried into Career Pro in the same browser tab.</div></div></div></section>'''
              marker='</section><main>'
              if marker not in s:
                  raise SystemExit('ATS hero/main insertion marker missing')
              s=s.replace(marker,'</section>'+overview+'<main>',1)

          s=s.replace(
              "document.getElementById('unlockProTop').addEventListener('click',e=>startCheckout(e.currentTarget));",
              "const unlockProTop=document.getElementById('unlockProTop');if(unlockProTop)unlockProTop.addEventListener('click',e=>startCheckout(e.currentTarget));"
          )
          p.write_text(s)
          PY

          python billing_ui_patch.py release/ats-checker.html release/career-pro.html
          python subscription_ui_patch.py release/career-pro.html

          # Final V1 corrections: free ATS first, real homepage auth, resilient
          # post-payment entitlement recovery.
          python release_v1_fix.py release/index.html release/ats-checker.html

      - name: Validate browser JavaScript and release contents
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import re, subprocess, tempfile
          for name in ['index.html','ats-checker.html','career-pro.html','career-pdf-summarizer.html']:
              s=Path('release',name).read_text()
              scripts='\n'.join(re.findall(r'<script(?: [^>]*)?>(.*?)</script>',s,re.S))
              with tempfile.NamedTemporaryFile('w',suffix='.js',delete=False) as f:
                  f.write(scripts); path=f.name
              result=subprocess.run(['node','--check',path],capture_output=True,text=True)
              if result.returncode:
                  raise SystemExit(f'{name} JavaScript invalid: {result.stderr}')

          index=Path('release/index.html').read_text()
          ats=Path('release/ats-checker.html').read_text()
          pro=Path('release/career-pro.html').read_text()
          summary=Path('release/career-pdf-summarizer.html').read_text()

          # Homepage account controls must use real Supabase account auth.
          assert 'Something great is hatching!' not in index
          assert "openEggyAccount('login')" in index
          assert "openEggyAccount('signup')" in index
          assert 'id="eggAccountAuthScript"' in index

          # Free ATS experience comes first; Career Pro stays in the result area.
          assert 'id="careerProOverview"' not in ats
          assert 'href="#careerProOverview"' not in ats
          assert 'id="atsForm"' in ats
          assert 'id="careerPro"' in ats
          assert "document.getElementById('atsForm').addEventListener('submit'" in ats
          assert 'eggypdf_career_handoff' in ats and 'data.resume_text' in ats

          # Subscription pricing/account/recovery.
          assert 'id="careerBillingModal"' in ats
          assert 'Continue with Yearly' in ats
          assert '$48 USD billed annually' in ats
          assert '$6.99 USD billed monthly' in ats
          assert '2,000 AI credits/month' in ats
          assert '/api/billing/checkout' in ats
          assert '/api/account/' in ats
          assert '/api/billing/creator-code/redeem' in ats
          assert 'id="careerBillingRecovery"' in ats
          assert 'You will not be charged again' in ats
          assert 'Cancel anytime' not in ats
          assert 'Payments already made are non-refundable except where required by law.' not in ats

          assert 'importCareerHandoff' in pro
          assert pro.find('Optimize My Resume') < pro.find('AI PDF Summarizer')
          assert 'Download DOCX' in pro and 'Download PDF' in pro
          assert '/api/career/pro/regenerate-section' in pro
          assert '/api/billing/me' in pro
          assert 'X-Idempotency-Key' in pro
          assert 'Stop Next Renewal' in pro
          assert '/api/billing/subscription/cancel-renewal' in pro
          assert 'Cancel anytime' not in pro
          assert '/api/career/pro/pdf-summary' in summary
          required=['index.html','resume-builder.html','ats-checker.html','career-pro.html','career-pdf-summarizer.html','tools/qr-code.html','tools/merge.html','tools/compress.html']
          assert all(Path('release',x).exists() for x in required)
          print('CAREER PRO RELEASE VALIDATION PASSED')
          PY

      - name: Package Cloudflare ZIP
        shell: bash
        run: |
          set -euo pipefail
          rm -f EggyPDF-Career-Pro-Release-Cloudflare.zip
          (cd release && zip -qr ../EggyPDF-Career-Pro-Release-Cloudflare.zip .)
          unzip -t EggyPDF-Career-Pro-Release-Cloudflare.zip >/dev/null

      - name: Upload Cloudflare package
        uses: actions/upload-artifact@v4
        with:
          name: EggyPDF-Career-Pro-Release-Cloudflare
          path: EggyPDF-Career-Pro-Release-Cloudflare.zip
          if-no-files-found: error
          retention-days: 7
