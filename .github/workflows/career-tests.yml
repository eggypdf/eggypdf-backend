name: Career Pro Tests

on:
  pull_request:
    branches: [main]
  push:
    branches:
      - dev/career-pro-foundation
      - dev/dodo-career-pro-checkout
      - feat/career-pro-accounts-db
      - feat/link-career-pro-entitlements

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install minimal test dependencies
        run: pip install Flask Werkzeug pypdf requests python-docx reportlab
      - name: Run Career Pro tests
        run: python -m unittest -v test_career_engine.py test_career_routes.py test_career_export.py test_career_v2.py test_career_regen.py test_career_pdf_ai.py test_career_verify_fast.py test_account_routes.py test_career_entitlements.py
