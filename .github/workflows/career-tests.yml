name: Career Pro Tests

on:
  pull_request:
    branches: [main]
  push:
    branches:
      - main
      - dev/career-pro-foundation
      - dev/dodo-career-pro-checkout
      - feat/career-pro-accounts-db
      - feat/link-career-pro-entitlements
      - fix/career-pro-account-isolation
      - feat/free-ats-cv-extract
      - career-pro-billing-v1

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install minimal test dependencies
        run: pip install Flask Flask-Cors Werkzeug pypdf Pillow requests python-docx reportlab standardwebhooks
      - name: Validate launch hardening module
        run: python -m py_compile launch_hardening.py wsgi.py
      - name: Run Career Pro tests
        run: python -m unittest -v test_career_engine.py test_career_routes.py test_career_export.py test_career_v2.py test_career_ai.py test_career_ai_resilience.py test_career_regen.py test_career_pdf_ai.py test_career_verify_fast.py test_account_routes.py test_career_entitlements.py test_career_security_patch.py test_career_free_routes.py test_career_billing_v1.py test_career_webhook_v1.py test_core_pdf_tools.py
