name: Package Career Pro Buttons Only

on:
  push:
    branches: [main]

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build stable Cloudflare package with original Career Pro theme
        shell: bash
        run: |
          set -euo pipefail
          rm -rf cloudflare-upload EggyPDF-Career-Pro-Buttons-Only-Cloudflare.zip
          mkdir -p cloudflare-upload/tools cloudflare-upload/blog

          cp index.html cloudflare-upload/index.html
          cp ats-checker.html career-pro.html resume-builder.html cloudflare-upload/
          cp about-us.html contact.html cookie-policy.html privacy-policy.html terms.html robots.txt sitemap.xml favicon.svg cloudflare-upload/
          [ -f egg.png ] && cp egg.png cloudflare-upload/ || true
          cp site_editor-1/blog.html cloudflare-upload/blog.html
          cp -R site_editor-1/blog/. cloudflare-upload/blog/

          for f in compress crop delete-pages excel-to-pdf jpg-to-pdf merge page-numbers pdf-to-excel pdf-to-jpg pdf-to-png pdf-to-ppt pdf-to-text pdf-to-word png-to-pdf ppt-to-pdf protect rotate split unlock watermark word-to-pdf; do
            test -f "$f.html"
            cp "$f.html" "cloudflare-upload/tools/$f.html"
          done
          if [ -f site_editor-1/tools/qr-code.html ]; then cp site_editor-1/tools/qr-code.html cloudflare-upload/tools/qr-code.html; fi

          python - <<'PY'
          from pathlib import Path

          p = Path('cloudflare-upload/career-pro.html')
          s = p.read_text()

          # 1) Keep the exact existing hero/theme. Only add feature buttons under the existing tagline.
          old_hero = '<section class="hero"><b class="badge">CAREER PRO V2</b><h1>Turn your resume into a stronger <span>application.</span></h1><p>Upload your resume, match it to a real job, optimize the content, and create application-ready material without inventing experience.</p></section>'
          new_hero = '<section class="hero"><b class="badge">CAREER PRO V2</b><h1>Turn your resume into a stronger <span>application.</span></h1><p>Upload your resume, match it to a real job, optimize the content, and create application-ready material without inventing experience.</p><div class="tabs" style="justify-content:center;flex-wrap:wrap"><button class="tab active" data-panel="opt">Resume Optimizer</button><button class="tab" data-panel="letter">AI Cover Letter</button><button class="tab" data-panel="summary">AI PDF Summarizer</button></div></section>'
          assert old_hero in s, 'Original Career Pro hero not found; refusing to alter theme.'
          s = s.replace(old_hero, new_hero, 1)

          # 2) Remove the old duplicated two-button tab row below the resume/job inputs.
          old_tabs = '<div class="tabs"><button class="tab active" data-panel="opt">Resume Optimizer</button><button class="tab" data-panel="letter">AI Cover Letter</button></div>'
          assert old_tabs in s, 'Original tab row not found.'
          s = s.replace(old_tabs, '', 1)

          # 3) Add PDF Summarizer as a normal existing-theme panel. No redesign CSS.
          workspace_end = '</section>\n</section>\n</main>'
          assert workspace_end in s, 'Career Pro workspace ending not found.'
          summary_panel = '''</section>\n<section class="card panel" id="summary"><h2>AI PDF Summarizer</h2><p class="muted">Upload a text-based PDF and get a clear overview, key points, important details and action items.</p><div class="drop" id="summaryDrop"><b>Drop a PDF here or click to browse</b><small>PDF only · up to 15 MB · up to 120 pages</small><div class="uploadmsg" id="summaryUploadmsg"></div></div><input id="summaryFile" type="file" accept="application/pdf,.pdf" hidden><select id="summaryDetail" aria-label="Summary detail"><option value="short">Short summary</option><option value="detailed">Detailed summary</option></select><button class="btn" id="summaryBtn" disabled>Summarize PDF</button><div class="feature-note">Scanned or image-only PDFs are not supported yet. Use a text-based PDF or OCR the file first.</div><div class="output" id="summaryOut"></div></section>\n</section>\n</main>'''
          s = s.replace(workspace_end, summary_panel, 1)

          # 4) Keep existing tab behavior, with one extra rule: resume/job inputs hide only for PDF Summarizer.
          old_handler = "document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{document.querySelectorAll('.tab,.panel').forEach(x=>x.classList.remove('active'));b.classList.add('active');$(b.dataset.panel).classList.add('active')});"
          new_handler = "document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{document.querySelectorAll('.tab,.panel').forEach(x=>x.classList.remove('active'));b.classList.add('active');$(b.dataset.panel).classList.add('active');document.querySelector('.inputs').style.display=b.dataset.panel==='summary'?'none':'grid'});"
          assert old_handler in s, 'Original tab JavaScript not found.'
          s = s.replace(old_handler, new_handler, 1)

          # 5) Add summarizer functionality without touching Resume Optimizer or Cover Letter code.
          summary_js = r'''
const summaryDrop=$('summaryDrop'),summaryFile=$('summaryFile'),summaryBtn=$('summaryBtn');let selectedSummaryPdf=null,lastSummaryText='';
summaryDrop.onclick=()=>summaryFile.click();
['dragenter','dragover'].forEach(e=>summaryDrop.addEventListener(e,x=>{x.preventDefault();summaryDrop.classList.add('drag')}));
['dragleave','drop'].forEach(e=>summaryDrop.addEventListener(e,x=>{x.preventDefault();summaryDrop.classList.remove('drag')}));
summaryDrop.addEventListener('drop',e=>{const f=e.dataTransfer.files[0];if(f)chooseSummaryPdf(f)});
summaryFile.onchange=()=>summaryFile.files[0]&&chooseSummaryPdf(summaryFile.files[0]);
function chooseSummaryPdf(f){if(!f.name.toLowerCase().endsWith('.pdf')){$('summaryUploadmsg').textContent='Choose a PDF file.';selectedSummaryPdf=null;summaryBtn.disabled=true;return}selectedSummaryPdf=f;$('summaryUploadmsg').textContent='Selected: '+f.name+' ('+(f.size/1024/1024).toFixed(2)+' MB)';summaryBtn.disabled=false}
function summaryList(title,items){if(!items||!items.length)return'';return '<div class="block"><h3>'+esc(title)+'</h3><ul>'+items.map(x=>'<li>'+esc(x)+'</li>').join('')+'</ul></div>'}
function summaryText(s,d){let a=[s.title,'',s.overview,'','Key points:',...(s.key_points||[]).map(x=>'• '+x)];if(s.important_details?.length)a.push('','Important details:',...s.important_details.map(x=>'• '+x));if(s.action_items?.length)a.push('','Action items:',...s.action_items.map(x=>'• '+x));a.push('','Source: '+d.filename+' · '+d.page_count+' pages');return a.join('\n')}
summaryBtn.onclick=async function(){const out=$('summaryOut');if(!selectedSummaryPdf)return;this.disabled=true;this.textContent='Summarizing…';$('summaryUploadmsg').textContent='Reading and summarizing '+selectedSummaryPdf.name+'…';try{const form=new FormData();form.append('session_id',session);form.append('pdf',selectedSummaryPdf);form.append('detail',$('summaryDetail').value);const r=await fetch(API+'/api/career/pro/pdf-summary',{method:'POST',body:form}),d=await r.json();if(!r.ok||!d.success)throw Error(d.error||'PDF summary failed.');const x=d.summary,doc=d.document;lastSummaryText=summaryText(x,doc);out.innerHTML='<div class="block"><h3>'+esc(x.title)+'</h3><div class="pre">'+esc(x.overview)+'</div></div>'+summaryList('Key points',x.key_points)+summaryList('Important details',x.important_details)+summaryList('Action items',x.action_items)+'<div class="integrity">'+esc(x.integrity_note||'')+'</div><div class="actions"><button class="btn secondary" id="copySummary">Copy Summary</button><button class="btn secondary" id="downloadSummary">Download .txt</button></div>';out.style.display='block';$('copySummary').onclick=()=>navigator.clipboard.writeText(lastSummaryText);$('downloadSummary').onclick=()=>{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([lastSummaryText],{type:'text/plain'}));a.download='EggyPDF-PDF-Summary.txt';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)};$('summaryUploadmsg').textContent='Summary ready.'}catch(e){out.textContent=e.message;out.style.display='block';$('summaryUploadmsg').textContent=''}finally{this.disabled=false;this.textContent='Summarize PDF'}};
'''
          assert '</script>' in s
          s = s.replace('</script>', summary_js + '\n</script>', 1)

          p.write_text(s)
          PY

          python - <<'PY'
          from pathlib import Path
          s=Path('cloudflare-upload/career-pro.html').read_text()
          assert 'CAREER PRO V2' in s
          assert 'Turn your resume into a stronger <span>application.</span>' in s
          assert s.count('Resume Optimizer</button>') == 1
          assert s.count('AI Cover Letter</button>') == 1
          assert s.count('AI PDF Summarizer</button>') == 1
          assert '/api/career/pro/optimize' in s
          assert '/api/career/pro/cover-letter' in s
          assert '/api/career/pro/pdf-summary' in s
          assert 'background:#f9fafb' in s
          assert '#f5a623' in s
          print('VALIDATION PASSED: original Career Pro theme preserved; buttons-only navigation added.')
          PY

          (cd cloudflare-upload && zip -qr ../EggyPDF-Career-Pro-Buttons-Only-Cloudflare.zip .)
          unzip -t EggyPDF-Career-Pro-Buttons-Only-Cloudflare.zip >/dev/null

      - name: Upload Cloudflare package
        uses: actions/upload-artifact@v4
        with:
          name: EggyPDF-Career-Pro-Buttons-Only-Cloudflare
          path: EggyPDF-Career-Pro-Buttons-Only-Cloudflare.zip
          if-no-files-found: error
          retention-days: 7
