name: Package Career Pro Buttons Only

on:
  push:
    branches: [main]

permissions:
  contents: read
  actions: read

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Restore current Cloudflare frontend
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          rm -rf release /tmp/eggy-current
          mkdir -p release /tmp/eggy-current
          gh api repos/${{ github.repository }}/actions/artifacts/10274236600/zip > /tmp/eggy-current/artifact.zip
          unzip -q /tmp/eggy-current/artifact.zip -d release
          cp career-pro.html release/career-pro.html
          cp career-pdf-summarizer.html release/career-pdf-summarizer.html

      - name: Add feature buttons only
        run: |
          set -euo pipefail
          echo '' | base64 -d > /tmp/patch.py
          python /tmp/patch.py

      - name: Validate no theme redesign
        run: |
          set -euo pipefail
          grep -q 'CAREER PRO V2' release/career-pro.html
          grep -q 'background:#f9fafb' release/career-pro.html
          grep -q '#f5a623' release/career-pro.html
          test "$(grep -o 'Resume Optimizer</button>' release/career-pro.html | wc -l)" -eq 1
          test "$(grep -o 'AI Cover Letter</button>' release/career-pro.html | wc -l)" -eq 1
          test "$(grep -o 'AI PDF Summarizer</button>' release/career-pro.html | wc -l)" -eq 1
          grep -q '/api/career/pro/optimize' release/career-pro.html
          grep -q '/api/career/pro/cover-letter' release/career-pro.html
          grep -q '/api/career/pro/pdf-summary' release/career-pro.html

      - name: Package Cloudflare ZIP
        run: |
          set -euo pipefail
          rm -f EggyPDF-Career-Pro-Buttons-Only-Cloudflare.zip
          (cd release && zip -qr ../EggyPDF-Career-Pro-Buttons-Only-Cloudflare.zip .)
          unzip -t EggyPDF-Career-Pro-Buttons-Only-Cloudflare.zip >/dev/null

      - name: Upload package
        uses: actions/upload-artifact@v4
        with:
          name: EggyPDF-Career-Pro-Buttons-Only-Cloudflare
          path: EggyPDF-Career-Pro-Buttons-Only-Cloudflare.zip
          if-no-files-found: error
          retention-days: 7
