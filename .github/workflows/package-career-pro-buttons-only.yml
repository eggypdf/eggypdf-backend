name: Package Career Pro Buttons Only

on:
  push:
    branches: [main]

permissions:
  contents: read
  actions: read

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Restore current Cloudflare frontend
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          rm -rf release /tmp/eggy-current
          mkdir -p release /tmp/eggy-current
          gh api repos/${{ github.repository }}/actions/artifacts/10274236600/zip > /tmp/eggy-current/artifact.zip
          unzip -q /tmp/eggy-current/artifact.zip -d release
          cp career-pro.html release/career-pro.html
          cp career-pdf-summarizer.html release/career-pdf-summarizer.html

      - name: Add feature buttons only
        run: python scripts/add-career-buttons.py

      - name: Confirm the original Career Pro page and three buttons exist
        run: |
          set -euo pipefail
          grep -q 'CAREER PRO V2' release/career-pro.html
          grep -q 'Resume Optimizer' release/career-pro.html
          grep -q 'AI Cover Letter' release/career-pro.html
          grep -q 'AI PDF Summarizer' release/career-pro.html
          echo 'Career Pro original theme source preserved and feature buttons added.'

      - name: Package Cloudflare ZIP
        run: |
          set -euo pipefail
          rm -f EggyPDF-Career-Pro-Buttons-Only-Cloudflare.zip
          (cd release && zip -qr ../EggyPDF-Career-Pro-Buttons-Only-Cloudflare.zip .)
          unzip -t EggyPDF-Career-Pro-Buttons-Only-Cloudflare.zip >/dev/null

      - name: Upload package
        uses: actions/upload-artifact@v4
        with:
          name: EggyPDF-Career-Pro-Buttons-Only-Cloudflare
          path: EggyPDF-Career-Pro-Buttons-Only-Cloudflare.zip
          if-no-files-found: error
          retention-days: 7
