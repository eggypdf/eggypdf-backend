name: Package Cloudflare Frontend Day2 V4
on:
  push:
    branches: [main]
jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build validated frontend package
        run: |
          set -euo pipefail
          mkdir -p cloudflare-upload/tools cloudflare-upload/blog
          cp index.html cloudflare-upload/index.html
          python - <<'PY'
          from pathlib import Path
          p=Path('cloudflare-upload/index.html'); s=p.read_text()
          s=s.replace('<title>EggyPDF – Free Online PDF Tools | Merge, Compress, Convert PDF</title> <title>EggyPDF – Free PDF Tools & Resume Builder Online</title>','<title>EggyPDF – Free PDF Tools & Resume Builder Online</title>')
          s=s.replace('<meta name="description" content=<meta name="description" content="Free PDF tools and resume builder online. Merge, compress, convert PDFs and create a job-ready resume in minutes. No sign-up needed. Built for UAE & Gulf job seekers.">','<meta name="description" content="Free PDF tools and resume builder online. Merge, compress, convert PDFs and create a job-ready resume in minutes. No sign-up needed. Built for UAE & Gulf job seekers."/>')
          s=s.replace('</style> .seo-section {','.seo-section {').replace('</head>','</style>\n</head>',1)
          end='    </a>\n\n    <!-- ② MOST USED DAILY — Merge, Compress, Split -->'
          card='''    </a>\n\n    <a href="ats-checker.html" class="tool-card" data-cat="ai" style="border-color:#f5a623;background:linear-gradient(135deg,#fff8ed,#fff)">\n      <div class="tool-icon" style="background:#fff3cd;font-size:1.5rem">🎯</div>\n      <h3 style="color:#d4881a">ATS Resume Checker <span style="font-size:10px;background:#f5a623;color:#fff;padding:2px 7px;border-radius:20px;font-weight:700;vertical-align:middle;margin-left:4px">NEW</span></h3>\n      <p>Check your resume against a job description and find missing keywords and improvements.</p>\n    </a>\n\n    <!-- ② MOST USED DAILY — Merge, Compress, Split -->'''
          assert end in s; s=s.replace(end,card,1); p.write_text(s)
          PY
          cp ats-checker.html resume-builder.html cloudflare-upload/
          python - <<'PY'
          from pathlib import Path
          p=Path('cloudflare-upload/resume-builder.html'); s=p.read_text()
          # one title only
          s=s.replace('<head> <title>Free Resume Builder – Download PDF Instantly | EggyPDF</title>\n<meta name="description" content="Build a professional resume online and download as PDF for free. No sign-up needed. Designed for job seekers in UAE, Gulf, and worldwide.">','<head>\n<meta name="description" content="Build a professional resume online and download as PDF for free. No sign-up needed. Designed for job seekers in UAE, Gulf, and worldwide.">')
          # Source has SEO section after closing html. Remove it from there and insert before body close.
          marker='<section class="seo-section">'
          i=s.find(marker); assert i!=-1
          seo=s[i:]
          s=s[:i].rstrip()
          assert s.endswith('</html>')
          s=s[:-7].rstrip(); assert s.endswith('</body>')
          s=s[:-7].rstrip()+'\n\n'+seo+'\n</body>\n</html>\n'
          css="""\n/* Resume SEO article */\n.seo-section{max-width:780px;margin:48px auto;padding:0 20px 48px;color:var(--text);font-family:'Inter',sans-serif;line-height:1.7}\n.seo-section h2{font-size:1.3rem;line-height:1.3;margin:28px 0 10px;color:var(--text)}\n.seo-section h3{font-size:1rem;line-height:1.4;margin:18px 0 6px;color:var(--text)}\n.seo-section p{font-size:.97rem;line-height:1.7;margin:0 0 14px;color:var(--muted)}\n@media(max-width:640px){.seo-section{margin:28px auto;padding:0 18px 36px}.seo-section h2{font-size:1.15rem}.seo-section p{font-size:.92rem}}\n"""
          s=s.replace('</style>',css+'</style>',1); p.write_text(s)
          PY
          cp about-us.html contact.html cookie-policy.html privacy-policy.html terms.html robots.txt sitemap.xml favicon.svg cloudflare-upload/
          [ -f egg.png ] && cp egg.png cloudflare-upload/ || true
          cp site_editor-1/blog.html cloudflare-upload/blog.html; cp -R site_editor-1/blog/. cloudflare-upload/blog/
          for f in compress crop delete-pages excel-to-pdf jpg-to-pdf merge page-numbers pdf-to-excel pdf-to-jpg pdf-to-png pdf-to-ppt pdf-to-text pdf-to-word png-to-pdf ppt-to-pdf protect rotate split unlock watermark word-to-pdf; do test -f "$f.html"; cp "$f.html" "cloudflare-upload/tools/$f.html"; done
          [ ! -f cloudflare-upload/tools/edit-pdf.html ]
          python - <<'PY'
          from pathlib import Path
          h=Path('cloudflare-upload/index.html').read_text(); r=Path('cloudflare-upload/resume-builder.html').read_text()
          assert h.count('<title>')==1 and 'content=<meta' not in h and 'ATS Resume Checker' in h and 'href="ats-checker.html"' in h
          assert Path('cloudflare-upload/ats-checker.html').exists()
          assert r.count('<title>')==1 and r.count('</body>')==1 and r.count('</html>')==1
          assert 0 < r.find('<section class="seo-section">') < r.find('</body>') < r.find('</html>')
          assert '.seo-section{' in r
          required=['merge','compress','split','pdf-to-word','word-to-pdf','ppt-to-pdf','excel-to-pdf','jpg-to-pdf','pdf-to-jpg','png-to-pdf','pdf-to-png','protect','unlock','watermark','rotate','delete-pages','page-numbers','crop','pdf-to-excel','pdf-to-ppt','pdf-to-text']
          assert all(Path(f'cloudflare-upload/tools/{x}.html').exists() for x in required)
          print('VALIDATION PASSED: ATS card + resume SEO + 21 tools')
          PY
      - name: Upload validated package
        uses: actions/upload-artifact@v4
        with:
          name: EggyPDF-Cloudflare-Day2-V4
          path: cloudflare-upload/
          if-no-files-found: error
          retention-days: 3
