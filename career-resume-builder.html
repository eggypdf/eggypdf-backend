<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex"><title>AI Resume Builder | Career Pro | EggyPDF</title><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet"><style>*{box-sizing:border-box}body{margin:0;font-family:Inter,sans-serif;background:#f9fafb;color:#1a1a2e}.top{height:62px;background:#fff;border-bottom:1px solid #e5e7eb;display:flex;align-items:center;padding:0 18px}.topin{width:100%;max-width:1400px;margin:auto;display:flex;align-items:center;gap:10px}.logo{font-weight:800;font-size:19px;text-decoration:none;color:#1a1a2e}.logo span{color:#f5a623}.badge{font-size:10px;font-weight:800;background:#1a1a2e;color:#fff;padding:4px 8px;border-radius:99px}.back{margin-left:auto;text-decoration:none;color:#6b7280;font-size:12px}.shell{max-width:1400px;margin:auto;padding:14px}.gate,.bar{background:#fff;border:1px solid #e5e7eb;border-radius:13px;padding:16px}.gate{text-align:center;max-width:650px;margin:40px auto}.gate p{font-size:12px;color:#6b7280}.gate .err{color:#991b1b}.workspace{display:none}.barrow{display:flex;align-items:center;gap:8px;flex-wrap:wrap}.bar h2{font-size:15px;margin:0 8px 0 0}.bar select{min-width:230px;padding:9px;border:1px solid #e5e7eb;border-radius:8px;background:#fff}.btn{border:0;border-radius:8px;padding:9px 11px;font-weight:700;cursor:pointer;background:#f5a623;color:#fff}.btn.alt{background:#fff;color:#1a1a2e;border:1px solid #e5e7eb}.btn.danger{color:#991b1b}.state{margin-left:auto;font-size:11px;color:#6b7280}.note{font-size:11px;color:#6b7280;margin-top:8px}.framebox{margin-top:12px;border:1px solid #e5e7eb;border-radius:13px;overflow:hidden;background:#fff}.frame{width:100%;height:calc(100vh - 154px);min-height:700px;border:0;display:block}@media(max-width:700px){.back{display:none}.state{width:100%;margin-left:0}.frame{height:calc(100vh - 215px);min-height:620px}}</style></head><body><header class="top"><div class="topin"><a class="logo" href="/">Eggy<span>PDF</span></a><span class="badge">CAREER PRO</span><a class="back" href="career-pro.html">← Career Pro Dashboard</a></div></header><main class="shell"><section class="gate" id="gate"><h2>Opening your saved Resume Builder</h2><p id="gateMsg">Checking your Career Pro account…</p></section><section class="workspace" id="workspace"><div class="bar"><div class="barrow"><h2>My Resumes</h2><select id="resumeSelect"></select><button class="btn" id="newBtn">+ New</button><button class="btn alt" id="renameBtn">Rename</button><button class="btn alt" id="copyBtn">Duplicate</button><button class="btn alt danger" id="deleteBtn">Delete</button><span class="state" id="saveState">Saved</span></div><div class="note">Career Pro saves your resume to your account. Summary and experience AI generate 3 sets × 4 options, then loop those 12 saved options without new AI calls.</div></div><div class="framebox"><iframe id="builder" class="frame" src="resume-builder.html?career_pro=1" title="EggyPDF AI Resume Builder"></iframe></div></section></main><script>
const API='https://eggypdf-backend-1.onrender.com',KEY='eggypdf_account_session',$=id=>document.getElementById(id);let items=[],active=null,ready=false,saving=false,timer=null,applying=false;
const session=()=>{try{return JSON.parse(localStorage.getItem(KEY)||'null')}catch(_){return null}},token=()=>session()?.access_token||'',auth=()=>token()?{Authorization:'Bearer '+token()}:{};
async function json(r){let t=await r.text();try{return JSON.parse(t)}catch(_){return{error:t||'Unexpected server response.'}}}async function refresh(){let s=session();if(!s?.refresh_token)return false;try{let r=await fetch(API+'/api/account/refresh',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({refresh_token:s.refresh_token})}),d=await json(r);if(r.ok&&d.session?.access_token){localStorage.setItem(KEY,JSON.stringify(d.session));return true}}catch(_){}return false}async function api(path,opt={},retry=true){opt.headers={...(opt.headers||{}),...auth()};if(opt.body&&!(opt.body instanceof FormData))opt.headers['Content-Type']='application/json';let r=await fetch(API+path,opt);if(r.status===401&&retry&&await refresh())return api(path,opt,false);let d=await json(r);if(!r.ok)throw Error(d.error||'Request failed.');return d}
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function win(){return $('builder').contentWindow}function ev(code){return win().eval(code)}function val(doc,id,v){let e=doc.getElementById(id);if(e)e.value=v??''}
async function verify(){try{if(!token())throw Error('Sign in to the EggyPDF account linked to Career Pro.');let d=await api('/api/account/me');if(!d.career_pro?.active)throw Error('Career Pro is not active on this account.');$('gate').style.display='none';$('workspace').style.display='block';await list()}catch(e){$('gateMsg').className='err';$('gateMsg').textContent=e.message}}
async function list(){let d=await api('/api/resume/saved/list');items=d.resumes||[];active=d.active_resume_id||items[0]?.id||null;render();if(!active)await create('My Resume');else if(ready)await open(active)}function render(){$('resumeSelect').innerHTML=items.map(x=>`<option value="${x.id}" ${x.id===active?'selected':''}>${esc(x.title)}</option>`).join('');['renameBtn','copyBtn','deleteBtn'].forEach(id=>$(id).disabled=!active)}
async function create(title,state={},template='minimal'){let d=await api('/api/resume/saved',{method:'POST',body:JSON.stringify({title,template_id:template,resume_state:state})});active=d.resume.id;await list()}
function snapshot(){let d=win().getData(),template='minimal',photo='',x=50,y=50;try{template=ev('currentTemplate');photo=ev('profilePhoto||""');x=ev('photoPosX||50');y=ev('photoPosY||50')}catch(_){}return{...d,template,profilePhoto:photo,photoPosX:x,photoPosY:y}}
function restore(s={},template='minimal'){let w=win(),doc=w.document;applying=true;doc.querySelectorAll('input,textarea,select').forEach(e=>{if(e.id!=='photoInput')e.value=''});['experienceEntries','educationEntries','languageEntries'].forEach(id=>doc.getElementById(id).innerHTML='');ev('skills=[];experiences=[];educations=[];languages=[];expCount=0;eduCount=0;langCount=0;Object.keys(expAICache).forEach(k=>delete expAICache[k]);summaryAICache.round1=null;summaryAICache.round2=null;summaryAICache.clickCount=0;summaryAICache.usedSet=new Set();');['firstName','lastName','jobTitle','email','phone','location','linkedin','summary'].forEach(k=>val(doc,k,s[k]));ev('skills='+JSON.stringify(s.skills||[])+';renderSkills()');(s.exps||[]).forEach((e,i)=>{w.addExperience();val(doc,`exp-title-${i}`,e.title);val(doc,`exp-company-${i}`,e.company);val(doc,`exp-location-${i}`,e.location);val(doc,`exp-start-${i}`,e.start);val(doc,`exp-end-${i}`,e.end);val(doc,`exp-desc-${i}`,e.desc)});(s.edus||[]).forEach((e,i)=>{w.addEducation();val(doc,`edu-degree-${i}`,e.degree);val(doc,`edu-school-${i}`,e.school);val(doc,`edu-location-${i}`,e.location);val(doc,`edu-start-${i}`,e.start);val(doc,`edu-end-${i}`,e.end)});(s.langs||[]).forEach((e,i)=>{w.addLanguage();val(doc,`lang-name-${i}`,e.name);val(doc,`lang-level-${i}`,e.level)});try{ev('currentTemplate='+JSON.stringify(s.template||template)+';profilePhoto='+JSON.stringify(s.profilePhoto||'')+';photoPosX='+Number(s.photoPosX||50)+';photoPosY='+Number(s.photoPosY||50))}catch(_){}w.updatePreview();w.updateProgress();setTimeout(()=>applying=false,200)}
async function open(id){if(!ready||!id)return;applying=true;$('saveState').textContent='Loading…';try{let d=await api('/api/resume/saved/'+encodeURIComponent(id));active=id;restore(d.resume.resume_state||{},d.resume.template_id||'minimal');$('resumeSelect').value=id;$('saveState').textContent='Saved'}catch(e){$('saveState').textContent=e.message}}
function queue(){if(applying||!ready||!active)return;$('saveState').textContent='Unsaved changes';clearTimeout(timer);timer=setTimeout(save,800)}async function save(){if(saving||!ready||!active)return;saving=true;try{$('saveState').textContent='Saving…';let s=snapshot();await api('/api/resume/saved/'+encodeURIComponent(active),{method:'PUT',body:JSON.stringify({resume_state:s,template_id:s.template||'minimal'})});$('saveState').textContent='Saved'}catch(e){$('saveState').textContent='Save failed'}finally{saving=false}}
$('resumeSelect').onchange=async e=>{await save();await open(e.target.value)};$('newBtn').onclick=async()=>{let n=prompt('Resume name','My Resume');if(n?.trim())await create(n.trim())};$('renameBtn').onclick=async()=>{let cur=items.find(x=>x.id===active),n=prompt('Resume name',cur?.title||'My Resume');if(n?.trim()){await api('/api/resume/saved/'+active,{method:'PUT',body:JSON.stringify({title:n.trim()})});await list()}};$('copyBtn').onclick=async()=>{if(!active)return;await save();let d=await api('/api/resume/saved/'+active),cur=items.find(x=>x.id===active);await create((cur?.title||'Resume')+' Copy',d.resume.resume_state||{},d.resume.template_id||'minimal')};$('deleteBtn').onclick=async()=>{if(!active||!confirm('Delete this saved resume?'))return;await api('/api/resume/saved/'+active,{method:'DELETE'});active=null;await list()};
function patch(){let w=win(),doc=w.document;ready=true;let h=doc.querySelector('.hero-strip h1');if(h)h.innerHTML='AI Resume Builder <span>— Career Pro</span>';let p=doc.querySelector('.hero-strip p');if(p)p.textContent='Create, save and return to your resume from the same Career Pro workspace.';let lab=doc.querySelector('#body-summary .ai-label');if(lab)lab.textContent='4 options × 3 generations · then loops';let originalAdd=w.addExperience;w.addExperience=function(){originalAdd();let i=ev('expCount-1'),l=doc.querySelector(`#exp-${i} .ai-label`);if(l)l.textContent='4 options × 3 generations · then loops';return i};w.showSummarySuggestions=async function(){let title=w.getJobTitle(),wrap=doc.getElementById('summary-suggestions'),load=doc.getElementById('summary-loading'),err=doc.getElementById('summary-error');if(!title){w.renderSummaryChips(wrap,ev('summaryLib.default'),new Set());return}load.classList.add('show');err.classList.remove('show');try{await save();let s=snapshot(),context=JSON.stringify({jobTitle:s.jobTitle,skills:s.skills,experience:s.exps,education:s.edus}),d=await api('/api/resume/ai-suggestions',{method:'POST',body:JSON.stringify({resume_id:active,section:'summary',section_key:'summary',job_title:title,source_context:context})});load.classList.remove('show');w.renderSummaryChips(wrap,d.suggestions,new Set())}catch(e){load.classList.remove('show');err.textContent=e.message;err.classList.add('show')}};w.showExpSuggestions=async function(i){let title=doc.getElementById(`exp-title-${i}`)?.value?.trim()||w.getJobTitle(),wrap=doc.getElementById(`exp-suggestions-${i}`),load=doc.getElementById(`exp-loading-${i}`),err=doc.getElementById(`exp-error-${i}`);if(!title){w.renderExpChips(wrap,i,ev('experienceLib.default'),new Set());return}if(load)load.classList.add('show');try{await save();let e=snapshot().exps[i]||{},context=JSON.stringify({title:e.title,company:e.company,location:e.location,start:e.start,end:e.end}),d=await api('/api/resume/ai-suggestions',{method:'POST',body:JSON.stringify({resume_id:active,section:'bullets',section_key:'experience-'+i,job_title:title,source_context:context})});if(load)load.classList.remove('show');w.renderExpChips(wrap,i,d.suggestions,new Set())}catch(e){if(load)load.classList.remove('show');if(err){err.textContent=e.message;err.classList.add('show')}}};doc.addEventListener('input',queue,true);doc.addEventListener('change',queue,true);doc.addEventListener('click',e=>{if(e.target.closest('.chip,.suggestion-list-item,.skill-add-btn,.entry-remove,.add-entry-btn,.tpl-btn'))setTimeout(queue,0)},true);if(active)open(active)}$('builder').addEventListener('load',patch);verify();
</script></body></html>
