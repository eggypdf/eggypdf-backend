<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Reset Password | EggyPDF</title>
<meta name="robots" content="noindex,nofollow">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}body{margin:0;font-family:Inter,Arial,sans-serif;background:#f9fafb;color:#1a1a2e;min-height:100vh}.top{height:68px;background:#fff;border-bottom:1px solid #e5e7eb;display:flex;align-items:center;padding:0 22px}.top-in{width:100%;max-width:1080px;margin:auto}.logo{font-size:24px;font-weight:800;text-decoration:none;color:#1a1a2e}.logo span{color:#f5a623}.wrap{min-height:calc(100vh - 68px);display:grid;place-items:center;padding:28px 18px}.card{width:min(460px,100%);background:#fff;border:1px solid #e5e7eb;border-radius:20px;padding:28px;box-shadow:0 20px 60px rgba(17,24,39,.09)}.crown{font-size:24px;text-align:center;margin-bottom:8px}.card h1{margin:0;text-align:center;font-size:30px;line-height:1.15}.sub{margin:10px auto 24px;text-align:center;color:#6b7280;font-size:14px;line-height:1.55;max-width:360px}.field{display:block;margin:14px 0}.field>span{display:block;font-size:12px;font-weight:800;margin-bottom:7px;color:#374151}.pw{position:relative}.pw input{width:100%;border:1.5px solid #e5e7eb;border-radius:12px;padding:13px 48px 13px 13px;font:inherit;outline:none;color:#1a1a2e}.pw input:focus{border-color:#f5a623;box-shadow:0 0 0 3px rgba(245,166,35,.12)}.eye{position:absolute;right:9px;top:50%;transform:translateY(-50%);width:34px;height:34px;border:0;background:transparent;cursor:pointer;color:#6b7280;font-size:18px}.btn{width:100%;border:1.5px solid #f5a623;border-radius:999px;padding:13px 18px;background:#f5a623;color:#1a1a2e;font-weight:800;font-size:15px;cursor:pointer;margin-top:8px}.btn:disabled{opacity:.6;cursor:not-allowed}.status{display:none;margin-top:14px;padding:11px 13px;border-radius:10px;font-size:12.5px;line-height:1.5}.status.show{display:block}.status.error{background:#fef2f2;border:1px solid #fecaca;color:#991b1b}.status.ok{background:#f0fdf4;border:1px solid #bbf7d0;color:#166534}.back{display:block;text-align:center;margin-top:16px;color:#9a670e;font-size:13px;font-weight:700;text-decoration:none}.hint{margin-top:12px;color:#9ca3af;font-size:11px;text-align:center}
</style>
</head>
<body>
<header class="top"><div class="top-in"><a class="logo" href="/">Eggy<span>PDF</span></a></div></header>
<main class="wrap">
<section class="card">
<div class="crown">♛</div>
<h1>Reset your password</h1>
<p class="sub">Create a new password for your EggyPDF account.</p>
<form id="form">
<label class="field"><span>New password</span><div class="pw"><input id="password" type="password" minlength="8" autocomplete="new-password" required placeholder="At least 8 characters"><button class="eye" type="button" data-for="password" aria-label="Show password">◉</button></div></label>
<label class="field"><span>Confirm new password</span><div class="pw"><input id="confirm" type="password" minlength="8" autocomplete="new-password" required placeholder="Enter it again"><button class="eye" type="button" data-for="confirm" aria-label="Show password">◉</button></div></label>
<button class="btn" id="submit" type="submit">Update Password</button>
<div class="status" id="status"></div>
</form>
<a class="back" href="/">Back to EggyPDF</a>
<div class="hint">Reset links are time-limited and can only be used while valid.</div>
</section>
</main>
<script>
const API='https://eggypdf-backend-1.onrender.com';
const $=id=>document.getElementById(id);
function getParams(){const out={};const hash=new URLSearchParams(location.hash.replace(/^#/,''));const query=new URLSearchParams(location.search);for(const [k,v] of hash)out[k]=v;for(const [k,v] of query)if(!(k in out))out[k]=v;return out}
function show(msg,type){const el=$('status');el.textContent=msg||'';el.className='status'+(msg?' show '+(type||''):'')}
function recoveryToken(){const p=getParams();return p.access_token||''}
document.querySelectorAll('.eye').forEach(b=>b.onclick=()=>{const input=$(b.dataset.for);const visible=input.type==='text';input.type=visible?'password':'text';b.setAttribute('aria-label',visible?'Show password':'Hide password');b.textContent=visible?'◉':'◎'});
$('form').addEventListener('submit',async e=>{e.preventDefault();const password=$('password').value,confirm=$('confirm').value,btn=$('submit');if(password.length<8){show('Password must be at least 8 characters.','error');return}if(password!==confirm){show('The two passwords do not match.','error');return}const token=recoveryToken();if(!token){show('This reset link is invalid or has expired. Request a new password-reset email from EggyPDF.','error');return}btn.disabled=true;btn.textContent='Updating…';show('','');try{const r=await fetch(API+'/api/account/password-update',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({access_token:token,password})});let d={};try{d=await r.json()}catch(_){}if(!r.ok||!d.success)throw Error(d.error||'Could not update your password.');history.replaceState(null,'','/reset-password.html');show('Password updated successfully. You can now sign in with your new password.','ok');btn.textContent='Password Updated';setTimeout(()=>location.href='/?signin=1',1800)}catch(err){show(err.message||'Could not update your password.','error');btn.disabled=false;btn.textContent='Update Password'}});
if(!recoveryToken()){show('This reset link is invalid or has expired. Request a new password-reset email from EggyPDF.','error')}
</script>
</body>
</html>
